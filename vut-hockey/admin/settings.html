<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings | VUT Hockey Admin</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="brand admin-brand" href="../index.html"><span class="brand-mark">V</span><span class="brand-text">VUT Hockey<small>Admin desk</small></span></a><nav class="admin-nav"></nav><div class="admin-side-bottom"><button class="button button-muted button-small" type="button" data-logout>Sign out</button></div></aside><section class="admin-main"><header class="admin-topbar"><button class="button button-muted button-small admin-menu-toggle" type="button">Menu</button><h1>Settings</h1><span data-admin-user>administrator</span></header><main class="admin-content"><div data-admin-feedback class="admin-feedback" hidden></div><article class="admin-card admin-form"><h2>Public club settings</h2><p>Only enter details that have been confirmed by the club.</p><form id="settings-form"><div class="form-grid"><div class="field field-full"><label for="club_name">Club name</label><input id="club_name" name="club_name"></div><div class="field"><label for="contact_email">Contact email</label><input id="contact_email" name="contact_email" type="email"></div><div class="field"><label for="contact_phone">Contact phone</label><input id="contact_phone" name="contact_phone"></div><div class="field field-full"><label for="address">Address</label><textarea id="address" name="address"></textarea></div><div class="field field-full"><label for="social_links">Social links</label><textarea id="social_links" name="social_links"></textarea></div></div><button class="button button-primary" type="submit">Save settings</button></form></article></main></section></div><script src="../js/api.js"></script><script src="../js/admin.js"></script><script>VUTAdmin.boot();</script><script src="../js/admin-settings.js"></script></body></html>
