<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Players | VUT Hockey Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar"><a class="brand admin-brand" href="../index.html"><span
                    class="brand-mark">V</span><span class="brand-text">VUT Hockey<small>Admin desk</small></span></a>
            <nav class="admin-nav"></nav>
            <div class="admin-side-bottom"><button class="button button-muted button-small" type="button"
                    data-logout>Sign out</button></div>
        </aside>
        <section class="admin-main">
            <header class="admin-topbar"><button class="button button-muted button-small admin-menu-toggle"
                    type="button">Menu</button>
                <h1>Players</h1><span data-admin-user>administrator</span>
            </header>
            <main class="admin-content">
                <div data-admin-feedback class="admin-feedback" hidden></div>
                <article class="admin-card admin-form">
                    <h2 data-form-title>Add player</h2>
                    <form data-admin-form><input type="hidden" name="id">
                        <div class="form-grid">
                            <div class="field">
                                <label for="team_id">Team</label>
                                <select id="team_id" name="team_id" required>
                                    <option value="" selected disabled>Loading teams...</option>
                                </select>
                            </div>
                            <div class="field"><label for="name">Name</label><input id="name" name="name" required>
                            </div>
                            <div class="field">
                                <label for="position">Position</label>
                                <select id="position" name="position">
                                    <option value="">Select a position</option>
                                    <option value="Goalkeeper">Goalkeeper</option>
                                    <option value="Defender">Defender</option>
                                    <option value="Link">Link</option>
                                    <option value="Forward">Forward</option>
                                </select>
                            </div>
                            <div class="field"><label for="squad_number">Squad number</label><input id="squad_number"
                                    name="squad_number" type="number" min="0"></div>
                            <div class="field field-full"><label for="image">Player image</label><input id="image"
                                    name="image" type="file" accept=".jpg,.jpeg,.png,.webp"></div>
                            <div class="field field-full"><label for="biography">Biography</label><textarea
                                    id="biography" name="biography"></textarea></div>
                        </div><button class="button button-primary" type="submit">Save player</button> <button
                            class="button button-muted" type="button" data-cancel>Cancel</button>
                    </form>
                </article>
                <article class="admin-card">
                    <div class="admin-toolbar">
                        <h2>Published players</h2>
                    </div>
                    <div class="table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Position</th>
                                    <th>Number</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody data-admin-list></tbody>
                        </table>
                    </div>
                </article>
            </main>
        </section>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>VUTAdmin.boot();</script>
    <script src="../js/admin-players.js"></script>
</body>

</html>
