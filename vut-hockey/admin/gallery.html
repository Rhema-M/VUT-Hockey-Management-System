<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery | VUT Hockey Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar"><a class="brand admin-brand" href="../index.html"><span
                    class="brand-mark">V</span><span class="brand-text">VUT Hockey<small>Admin desk</small></span></a>
            <nav class="admin-nav"></nav>
            <div class="admin-side-bottom"><button class="button button-muted button-small" type="button"
                    data-logout>Sign out</button></div>
        </aside>
        <section class="admin-main">
            <header class="admin-topbar"><button class="button button-muted button-small admin-menu-toggle"
                    type="button">Menu</button>
                <h1>Gallery</h1><span data-admin-user>administrator</span>
            </header>
            <main class="admin-content">
                <div data-admin-feedback class="admin-feedback" hidden></div>
                <article class="admin-card admin-form">
                    <h2 data-form-title>Add gallery item</h2>
                    <form data-admin-form><input type="hidden" name="id">
                        <div class="form-grid">
                            <div class="field field-full"><label for="image">Image</label><input id="image" name="image"
                                    type="file" accept=".jpg,.jpeg,.png,.webp"><small>JPG, JPEG, PNG, or WebP, up to 5
                                    MB.</small></div>
                            <div class="field"><label for="caption">Caption</label><input id="caption" name="caption">
                            </div>
                            <div class="field"><label for="category">Category</label><input id="category"
                                    name="category"></div>
                            <div class="field">
                                <label for="team_id">Team</label>
                                <select id="team_id" name="team_id">
                                    <option value="" selected>Select a team</option>
                                </select>
                            </div>
                        </div><button class="button button-primary" type="submit">Save gallery item</button> <button
                            class="button button-muted" type="button" data-cancel>Cancel</button>
                    </form>
                </article>
                <article class="admin-card">
                    <div class="admin-toolbar">
                        <h2>Published gallery</h2>
                    </div>
                    <div class="table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Caption</th>
                                    <th>Image</th>
                                    <th>Category</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody data-admin-list></tbody>
                        </table>
                    </div>
                </article>
            </main>
        </section>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>VUTAdmin.boot();</script>
    <script src="../js/admin-gallery.js"></script>
</body>

</html>
