<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Results | VUT Hockey Admin</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body"><div class="admin-shell">
<aside class="admin-sidebar"><a class="brand admin-brand" href="../index.html"><span class="brand-mark">V</span><span class="brand-text">VUT Hockey<small>Admin desk</small></span></a><nav class="admin-nav"></nav><div class="admin-side-bottom"><button class="button button-muted button-small" type="button" data-logout>Sign out</button></div></aside>
<section class="admin-main"><header class="admin-topbar"><button class="button button-muted button-small admin-menu-toggle" type="button">Menu</button><h1>Results</h1><span data-admin-user>administrator</span></header><main class="admin-content">
<div data-admin-feedback class="admin-feedback" hidden></div><article class="admin-card admin-form"><h2 data-form-title>Add result</h2><form data-admin-form><input type="hidden" name="id"><div class="form-grid"><div class="field"><label for="team_id">Team ID</label><input id="team_id" name="team_id" type="number" min="1" required></div><div class="field"><label for="opponent">Opponent</label><input id="opponent" name="opponent" required></div><div class="field"><label for="team_score">Team score</label><input id="team_score" name="team_score" type="number" min="0" required></div><div class="field"><label for="opponent_score">Opponent score</label><input id="opponent_score" name="opponent_score" type="number" min="0" required></div><div class="field"><label for="date">Date</label><input id="date" name="date" type="date" required></div><div class="field"><label for="competition">Competition</label><input id="competition" name="competition"></div><div class="field field-full"><label for="venue">Venue</label><input id="venue" name="venue"></div></div><button class="button button-primary" type="submit">Save result</button> <button class="button button-muted" type="button" data-cancel>Cancel</button></form></article>
<article class="admin-card"><div class="admin-toolbar"><h2>Published results</h2></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Match</th><th>Score</th><th>Actions</th></tr></thead><tbody data-admin-list></tbody></table></div></article>
</main></section></div><script src="../js/api.js"></script><script src="../js/admin.js"></script><script>VUTAdmin.boot();</script><script src="../js/admin-results.js"></script></body></html>
