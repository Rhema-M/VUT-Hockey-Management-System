<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>News | VUT Hockey Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar"><a class="brand admin-brand" href="../index.html"><span
                    class="brand-mark">V</span><span class="brand-text">VUT Hockey<small>Admin desk</small></span></a>
            <nav class="admin-nav"></nav>
            <div class="admin-side-bottom"><button class="button button-muted button-small" type="button"
                    data-logout>Sign out</button></div>
        </aside>
        <section class="admin-main">
            <header class="admin-topbar"><button class="button button-muted button-small admin-menu-toggle"
                    type="button">Menu</button>
                <h1>News</h1><span data-admin-user>administrator</span>
            </header>
            <main class="admin-content">
                <div data-admin-feedback class="admin-feedback" hidden></div>
                <article class="admin-card admin-form">
                    <h2 data-form-title>Add news item</h2>
                    <form data-admin-form><input type="hidden" name="id">
                        <div class="form-grid">
                            <div class="field field-full"><label for="title">Title</label><input id="title" name="title"
                                    required></div>
                            <div class="field"><label for="slug">Slug</label><input id="slug" name="slug" required>
                            </div>
                            <div class="field"><label for="published_at">Published at</label>
                                <input id="published_at" name="published_at" type="datetime-local">
                            </div>
                            <div class="field field-full"><label for="image">Featured image</label><input id="image"
                                    name="image" type="file" accept=".jpg,.jpeg,.png,.webp"></div>
                            <div class="field field-full"><label for="summary">Summary</label><textarea id="summary"
                                    name="summary" required></textarea></div>
                            <div class="field field-full"><label for="content">Article content</label><textarea
                                    id="content" name="content" required></textarea></div>
                            <div class="field publish-field">
                                <label for="published">
                                    <input id="published" name="published" type="checkbox">
                                    Publish this item
                                </label>
                            </div>
                        </div><button class="button button-primary" type="submit">Save news item</button> <button
                            class="button button-muted" type="button" data-cancel>Cancel</button>
                    </form>
                </article>
                <article class="admin-card">
                    <div class="admin-toolbar">
                        <h2>Published news</h2>
                    </div>
                    <div class="table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Summary</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody data-admin-list></tbody>
                        </table>
                    </div>
                </article>
            </main>
        </section>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>VUTAdmin.boot();</script>
    <script src="../js/admin-news.js"></script>
</body>

</html>
